name: Dependency updates

on:
  schedule:
    # Every Monday 06:30 UTC
    - cron: "30 6 * * 1"
  workflow_dispatch:
    inputs:
      scope:
        description: "Which packages to update"
        required: false
        default: "tanstack"
        type: choice
        options:
          - tanstack
          - all

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install current dependencies
        run: bun install --frozen-lockfile

      - name: Update dependencies
        id: update
        run: bash scripts/update-deps.sh "${{ inputs.scope || 'tanstack' }}"

      - name: Audit
        run: bun audit --audit-level=high || true

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/dependency-updates
          commit-message: "chore(deps): automated dependency update"
          title: "chore(deps): automated dependency update"
          labels: dependencies
          body: |
            Automated dependency update (scope: `${{ inputs.scope || 'tanstack' }}`).

            Verified in CI:
            - `bun run build`
            - `bunx tsc --noEmit`
            - `bun audit --audit-level=high`

            ```
            ${{ steps.update.outputs.summary }}
            ```
          delete-branch: true
